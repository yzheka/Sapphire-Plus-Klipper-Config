[mcu_flasher host]
silent: false
kconfig:
  CONFIG_LOW_LEVEL_OPTIONS=y
  CONFIG_MACH_LINUX=y
flash_cmd: 
  make flash

[mcu_flasher ebb36]
silent: false
kconfig:
  CONFIG_LOW_LEVEL_OPTIONS=y
  CONFIG_MACH_STM32=y
  CONFIG_MACH_STM32G0B1=y
  CONFIG_STM32_FLASH_START_2000=y
  CONFIG_STM32_CLOCK_REF_8M=y
  CONFIG_STM32_MMENU_CANBUS_PB0_PB1=y
  CONFIG_CANBUS_FREQUENCY=1000000
  CONFIG_WANT_STEPPER_OPTIMIZED_BOTH_EDGE=y
flash_cmd: 
  python3 ~/katapult/scripts/flashtool.py -i can0 -f ~/klipper/out/klipper.bin -u f9dfeb249347

[mcu_flasher m5p]
silent: false
kconfig:
  CONFIG_LOW_LEVEL_OPTIONS=y
  CONFIG_MACH_STM32=y
  CONFIG_MACH_STM32G0B1=y
  CONFIG_STM32_FLASH_START_2000=y
  CONFIG_STM32_CLOCK_REF_8M=y
  CONFIG_STM32_USBCANBUS_PA11_PA12=y
  CONFIG_STM32_CMENU_CANBUS_PD0_PD1=y
  CONFIG_CANBUS_FREQUENCY=1000000
  CONFIG_WANT_STEPPER_OPTIMIZED_BOTH_EDGE=y
flash_cmd:
  python3 ~/katapult/scripts/flashtool.py -u 3491df61732e -r # reset m8p to bootloader
  sleep 1
  python3 ~/katapult/scripts/flashtool.py -f ~/klipper/out/klipper.bin -d /dev/serial/by-id/usb-katapult_stm32g0b1xx_1C00430009504B5735313920-if00